services:
  glorpcat:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    image: glorpcat-app:dev

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video

    ipc: host

    ports:
      - "8000:8000"

    environment:
      GLORPCAT_DATA_DIR: /app/Data
      GLORPCAT_CHROMADB_DIR: /app/ChromaDB
      GLORPCAT_LLAMA_CPP_AUTO_START: "false"
      GLORPCAT_LLAMA_CPP_URL: http://inference:8081/v1
      GLORPCAT_MODEL_ALIAS: ${GLORPCAT_MODEL_ALIAS}
      GLORPCAT_MEDIA_URL: http://media:8082/v1
      GLORPCAT_MEDIA_ALIAS: ${GLORPCAT_MEDIA_ALIAS}
      MIOPEN_FIND_MODE: "2"

    volumes:
      - "./system_development/Data:/app/Data"
      - "../PaperParsing/Docling Parsing/v0.2/ChromaDB:/app/ChromaDB"
      - "glorpcat-hf-cache:/root/.cache/huggingface"

    command:
      - python3
      - -m
      - uvicorn
      - Web.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    depends_on:
      inference:
        condition: service_healthy
      media:
        condition: service_healthy

  inference:
    image: kyuz0/amd-strix-halo-toolboxes:rocm-10.0

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video

    ipc: host

    environment:
      MTP_MODEL_FILE: "${GLORPCAT_MODEL_MTP:-}"

    volumes:
      - "./models:/models:ro"

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        set -- llama-server \
          -m "/models/${GLORPCAT_MODEL_FILE}" \
          --host 0.0.0.0 \
          --port 8081 \
          -c 32768 \
          --device ROCm0 \
          -ngl 999 \
          --flash-attn on \
          --load-mode none \
          --alias "${GLORPCAT_MODEL_ALIAS}" \
          --reasoning on \
          --reasoning-format deepseek \
          --reasoning-preserve

        if [ -n "$$MTP_MODEL_FILE" ]; then
          draft_path="/models/$$MTP_MODEL_FILE"

          if [ ! -r "$$draft_path" ]; then
            echo "Cannot read MTP draft model: $$draft_path" >&2
            exit 1
          fi

          set -- "$$@" \
            --spec-type draft-mtp \
            --model-draft "$$draft_path" \
            --spec-draft-n-max 3 \
            --gpu-layers-draft 999
        else
          set -- "$$@" --spec-type none
        fi

        exec "$$@"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8081/health
      interval: 5s
      timeout: 3s
      retries: 60

  media:
    image: kyuz0/amd-strix-halo-toolboxes:rocm-10.0

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video

    ipc: host

    environment:
      MTP_MODEL_FILE: "${GLORPCAT_MEDIA_MTP:-}"

    volumes:
      - "./models:/models:ro"
    
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        set -- llama-server \
          -m "/models/${GLORPCAT_MEDIA_FILE}" \
          --mmproj "/models/${GLORPCAT_MEDIA_MMPROJ}" \
          --host 0.0.0.0 \
          --port 8082 \
          -c 32768 \
          --device ROCm0 \
          -ngl 999 \
          --flash-attn on \
          --load-mode none \
          --alias "${GLORPCAT_MEDIA_ALIAS}"

        if [ -n "$$MTP_MODEL_FILE" ]; then
          draft_path="/models/$$MTP_MODEL_FILE"

          if [ ! -r "$$draft_path" ]; then
            echo "Cannot read MTP draft model: $$draft_path" >&2
            exit 1
          fi

          set -- "$$@" \
            --spec-type draft-mtp \
            --model-draft "$$draft_path" \
            --spec-draft-n-max 3 \
            --gpu-layers-draft 999
        else
          set -- "$$@" --spec-type none
        fi

        exec "$$@"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8082/health
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  glorpcat-hf-cache:
    name: glorpcat-hf-cache