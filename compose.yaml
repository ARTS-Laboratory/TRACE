services:
  glorpcat:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: glorpcat-app:dev
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video

    ipc: host

    ports:
      - 8000:8000

    environment:
      GLORPCAT_DATA_DIR: /app/Data
      GLORPCAT_CHROMADB_DIR: /app/ChromaDB
      GLORPCAT_LLAMA_CPP_AUTO_START: 'false'
      GLORPCAT_LLAMA_CPP_URL: http://inference:8081/v1
      GLORPCAT_MODEL_ALIAS: ${GLORPCAT_MODEL_ALIAS}
      GLORPCAT_MEDIA_URL: http://media:8082/v1
      GLORPCAT_MEDIA_ALIAS: ${GLORPCAT_MEDIA_ALIAS}
      MIOPEN_FIND_MODE: '2'
      DOCLING_LIBREOFFICE_CMD: /usr/bin/libreoffice
      GLORPCAT_CONTROLLER_URL: http://controller:8090

    volumes:
      - ./system_development/Data:/app/Data
      - ../PaperParsing/Docling Parsing/v0.2/ChromaDB:/app/ChromaDB
      - glorpcat-hf-cache:/root/.cache/huggingface

    command:
      - python3
      - -m
      - uvicorn
      - Web.server:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'

    depends_on:
      inference:
        condition: service_healthy
      controller:
        condition: service_healthy
  inference:
    image: kyuz0/amd-strix-halo-toolboxes:rocm-10.0

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video

    ipc: host

    environment:
      MTP_MODEL_FILE: ${GLORPCAT_MODEL_MTP:-}

    volumes:
      - ./models:/models:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        set -- llama-server \
          -m "/models/${GLORPCAT_MODEL_FILE}" \
          --host 0.0.0.0 \
          --port 8081 \
          -c 32768 \
          --device ROCm0 \
          -ngl 999 \
          --flash-attn on \
          --load-mode none \
          --alias "${GLORPCAT_MODEL_ALIAS}" \
          --reasoning on \
          --reasoning-format deepseek \
          --reasoning-preserve

        if [ -n "$$MTP_MODEL_FILE" ]; then
          draft_path="/models/$$MTP_MODEL_FILE"

          if [ ! -r "$$draft_path" ]; then
            echo "Cannot read MTP draft model: $$draft_path" >&2
            exit 1
          fi

          set -- "$$@" \
            --spec-type draft-mtp \
            --model-draft "$$draft_path" \
            --spec-draft-n-max 3 \
            --gpu-layers-draft 999
        else
          set -- "$$@" --spec-type none
        fi

        exec "$$@"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8081/health
      interval: 5s
      timeout: 3s
      retries: 60
  media:
    image: kyuz0/amd-strix-halo-toolboxes:rocm-10.0
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video

    ipc: host

    environment:
      MTP_MODEL_FILE: ${GLORPCAT_MEDIA_MTP:-}

    volumes:
      - ./models:/models:ro

    profiles:
      - optional

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        set -- llama-server \
          -m "/models/${GLORPCAT_MEDIA_FILE}" \
          --mmproj "/models/${GLORPCAT_MEDIA_MMPROJ}" \
          --host 0.0.0.0 \
          --port 8082 \
          -c 32768 \
          --device ROCm0 \
          -ngl 999 \
          --flash-attn on \
          --load-mode none \
          --alias "${GLORPCAT_MEDIA_ALIAS}"

        if [ -n "$$MTP_MODEL_FILE" ]; then
          draft_path="/models/$$MTP_MODEL_FILE"

          if [ ! -r "$$draft_path" ]; then
            echo "Cannot read MTP draft model: $$draft_path" >&2
            exit 1
          fi

          set -- "$$@" \
            --spec-type draft-mtp \
            --model-draft "$$draft_path" \
            --spec-draft-n-max 3 \
            --gpu-layers-draft 999
        else
          set -- "$$@" --spec-type none
        fi

        exec "$$@"


    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8082/health
      interval: 5s
      timeout: 3s
      retries: 60
  surya:
    image: vllm/vllm-openai-rocm@sha256:14f6a575e1fb0a580b0f633c09e06f648709d60405b85f6a7ff3f80d49f39905

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video

    ipc: host

    environment:
      HSA_OVERRIDE_GFX_VERSION: 11.5.0
      MIOPEN_FIND_MODE: '2'
      PYTORCH_ALLOC_CONF: expandable_segments:True

    volumes:
      - /home/thienan/opt/surya-vllm/models:/root/.cache/huggingface
      - surya-vllm-cache:/root/.cache/vllm

    profiles:
      - optional

    ports:
      - 127.0.0.1:8001:8000

    command:
      - --model
      - datalab-to/surya-ocr-2
      - --served-model-name
      - datalab-to/surya-ocr-2
      - --dtype
      - bfloat16
      - --max-model-len
      - '16384'
      - --max-num-batched-tokens
      - '4096'
      - --mm-processor-kwargs
      - '{"min_pixels":3136,"max_pixels":1048576}'
      - --gpu-memory-utilization
      - '0.2'
      - --port
      - '8000'

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
          timeout=5)
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s
  marker:
    build:
      context: .
      dockerfile: docker/marker/Dockerfile

    image: glorpcat-marker:dev

    environment:
      SURYA_INFERENCE_BACKEND: vllm
      SURYA_INFERENCE_URL: http://surya:8000/v1
      SURYA_MAX_TOKENS_FULL_PAGE: '8192'

    volumes:
    - ./system_development/Data:/app/Data:ro
    - ./system_development/Data/output:/app/Data/output:rw

    profiles:
    - optional

    ports:
    - 127.0.0.1:8002:8002

    depends_on:
      surya:
        condition: service_healthy

    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health',
        timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  controller:
    build:
      context: .
      dockerfile: docker/controller/Dockerfile

    image: glorpcat-controller:dev

    environment:
      GATEWAY_URL: http://gateway:8091
      IDLE_SECONDS: "300"
      LEASE_SECONDS: "90"

    networks:
      - default
      - lifecycle
    depends_on:
      gateway:
        condition: service_healthy
      provisioner:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 12

  provisioner:
    build:
      context: .
      dockerfile: docker/provisioner/Dockerfile
    image: glorpcat-provisioner:dev
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        docker compose --project-name "$${COMPOSE_PROJECT}" \
          --project-directory "$${PROJECT_DIR}" \
          -f "$${PROJECT_DIR}/compose.yaml" \
          --profile optional create --build --no-recreate media surya marker
    environment:
      PROJECT_DIR: ${GLORPCAT_PROJECT_DIR}
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-glorp-cat}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GLORPCAT_PROJECT_DIR}:${GLORPCAT_PROJECT_DIR}:ro
    working_dir: ${GLORPCAT_PROJECT_DIR}
    restart: "no"
    network_mode: "none"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: glorpcat-gateway:dev
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-glorp-cat}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lifecycle
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  lifecycle:
    internal: true

volumes:
  glorpcat-hf-cache:
    name: glorpcat-hf-cache
  surya-vllm-cache:
    name: surya-vllm-cache
